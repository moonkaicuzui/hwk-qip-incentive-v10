name: Auto Update Dashboard

on:
  schedule:
    - cron: '0 * * * *'  # Every 1 hour
  workflow_dispatch:  # Manual trigger from admin page
    inputs:
      force_run:
        description: 'Force full pipeline run (skip change detection)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_month:
        description: 'Target month (e.g., february). Leave empty for auto-detect (latest config).'
        required: false
        default: ''
        type: string
      target_year:
        description: 'Target year (e.g., 2026). Leave empty for auto-detect.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ========== Step 1: Checkout ==========
      - name: "Step 1: Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========== Step 2: Setup Python ==========
      - name: "Step 2: Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Step 2.1: Install dependencies"
        run: |
          pip install -r requirements.txt

      # ========== Step 3: Download from Google Drive ==========
      - name: "Step 3: Download data from Google Drive"
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          echo "📥 Downloading latest data from Google Drive..."
          python scripts/download_from_gdrive.py
          echo "✅ Google Drive download complete"

      # ========== Step 4: Sync Thresholds from Firestore ==========
      - name: "Step 4: Sync thresholds from Firestore"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "🔄 Syncing thresholds from Firestore..."
          # Determine current month/year
          CURRENT_MONTH=$(python3 -c "
          import datetime
          months = ['january','february','march','april','may','june','july','august','september','october','november','december']
          print(months[datetime.datetime.now().month - 1])
          ")
          CURRENT_YEAR=$(date +%Y)
          echo "Current period: $CURRENT_MONTH $CURRENT_YEAR"
          python scripts/sync_thresholds.py --month "$CURRENT_MONTH" --year "$CURRENT_YEAR" || echo "⚠️ Threshold sync failed, using local config"
          echo "✅ Threshold sync complete"

      # ========== Step 4.5: Sync Config Settings from Firestore ==========
      - name: "Step 4.5: Sync config settings from Firestore"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "🔄 Syncing config settings from Firestore..."
          python scripts/sync_configs.py || echo "⚠️ Config sync failed, using local config files"
          echo "✅ Config sync complete"

      # ========== Step 5: Enhanced Download with Config ==========
      - name: "Step 5: Enhanced download with config update"
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          echo "📋 Running enhanced download with config..."
          python scripts/enhanced_download.py || echo "⚠️ Enhanced download skipped"
          echo "✅ Config update complete"

      # ========== Step 5.5: Determine Target Months ==========
      - name: "Step 5.5: Determine target months"
        id: target_month
        env:
          INPUT_MONTH: ${{ github.event.inputs.target_month || '' }}
          INPUT_YEAR: ${{ github.event.inputs.target_year || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          echo "🎯 Determining target months..."

          # If target month/year manually specified via workflow_dispatch, use only that
          if [ -n "$INPUT_MONTH" ] && [ -n "$INPUT_YEAR" ]; then
            MANUAL_CONFIG="config_files/config_${INPUT_MONTH}_${INPUT_YEAR}.json"
            if [ -f "$MANUAL_CONFIG" ]; then
              echo "📌 Manual target specified: $INPUT_MONTH $INPUT_YEAR"
              echo "target_months=${INPUT_MONTH}:${INPUT_YEAR}:${MANUAL_CONFIG}" >> $GITHUB_OUTPUT
              echo "data_changed=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "⚠️ Config file not found: $MANUAL_CONFIG — falling back to auto-detect"
            fi
          fi

          # Auto-detect: find all months with stale data (Google Drive newer than Firestore)
          STALE_MONTHS=$(python scripts/detect_stale_months.py 2>/dev/null)

          if [ "$FORCE_RUN" = "true" ] && [ -z "$STALE_MONTHS" ]; then
            # Force run: use latest config if no stale months detected
            echo "🔧 Force run - finding latest config..."
            STALE_MONTHS=$(python3 -c "
          import glob, re, json
          months = {'january':1,'february':2,'march':3,'april':4,'may':5,'june':6,
                    'july':7,'august':8,'september':9,'october':10,'november':11,'december':12}
          configs = glob.glob('config_files/config_*_*.json')
          best = None
          best_key = (0, 0)
          for f in configs:
              m = re.search(r'config_(\w+)_(\d{4})\.json', f)
              if m:
                  month_name, year_str = m.group(1), m.group(2)
                  month_num = months.get(month_name, 0)
                  year = int(year_str)
                  try:
                      with open(f) as fh:
                          cfg = json.load(fh)
                      if not cfg.get('file_paths'):
                          continue
                  except:
                      continue
                  if (year, month_num) > best_key:
                      best_key = (year, month_num)
                      best = (month_name, year_str, f)
          if best:
              print(f'{best[0]}:{best[1]}:{best[2]}')
          ")
          fi

          if [ -z "$STALE_MONTHS" ]; then
            # Check global hash for backward compatibility
            echo "🔍 No stale months from per-month detection, checking global hash..."
            python scripts/check_drive_changes.py check
            if [ $? -eq 0 ]; then
              # Changes detected but couldn't determine which month - use latest
              STALE_MONTHS=$(python3 -c "
          import glob, re, json
          months = {'january':1,'february':2,'march':3,'april':4,'may':5,'june':6,
                    'july':7,'august':8,'september':9,'october':10,'november':11,'december':12}
          configs = glob.glob('config_files/config_*_*.json')
          best = None
          best_key = (0, 0)
          for f in configs:
              m = re.search(r'config_(\w+)_(\d{4})\.json', f)
              if m:
                  month_name, year_str = m.group(1), m.group(2)
                  month_num = months.get(month_name, 0)
                  year = int(year_str)
                  try:
                      with open(f) as fh:
                          cfg = json.load(fh)
                      if not cfg.get('file_paths'):
                          continue
                  except:
                      continue
                  if (year, month_num) > best_key:
                      best_key = (year, month_num)
                      best = (month_name, year_str, f)
          if best:
              print(f'{best[0]}:{best[1]}:{best[2]}')
          ")
            fi
          fi

          if [ -n "$STALE_MONTHS" ]; then
            echo "🔄 Months to process: $STALE_MONTHS"
            echo "target_months=$STALE_MONTHS" >> $GITHUB_OUTPUT
            echo "data_changed=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No changes detected - skipping calculation and upload"
            echo "target_months=" >> $GITHUB_OUTPUT
            echo "data_changed=false" >> $GITHUB_OUTPUT
          fi

      # ========== Steps 6-8: Process All Stale Months ==========
      - name: "Steps 6-8: Calculate and upload for all changed months"
        if: steps.target_month.outputs.data_changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_MONTHS: ${{ steps.target_month.outputs.target_months }}
        run: |
          mkdir -p output_files
          PROCESSED=0
          FAILED=0

          for ENTRY in $TARGET_MONTHS; do
            IFS=':' read -r TARGET_MONTH TARGET_YEAR TARGET_CONFIG <<< "$ENTRY"

            echo ""
            echo "============================================================"
            echo "🎯 Processing: $TARGET_MONTH $TARGET_YEAR ($TARGET_CONFIG)"
            echo "============================================================"

            # Step 6: Convert attendance data
            echo "📊 Converting attendance data..."
            python src/convert_attendance_data.py "$TARGET_MONTH" "$TARGET_YEAR" || {
              echo "❌ Attendance conversion failed for $TARGET_MONTH $TARGET_YEAR"
              FAILED=$((FAILED + 1))
              continue
            }

            # Also convert previous month's attendance
            PREV_MONTH=$(python3 -c "
          months = ['january','february','march','april','may','june','july','august','september','october','november','december']
          idx = months.index('$TARGET_MONTH')
          prev_idx = (idx - 1) % 12
          print(months[prev_idx])
          ")
            PREV_YEAR=$TARGET_YEAR
            if [ "$PREV_MONTH" = "december" ]; then
              PREV_YEAR=$((TARGET_YEAR - 1))
            fi
            python src/convert_attendance_data.py "$PREV_MONTH" "$PREV_YEAR" 2>/dev/null || true

            # Step 6.5: Validate schema
            if [ -f "scripts/validate_attendance_schema.py" ]; then
              python scripts/validate_attendance_schema.py "$TARGET_MONTH" "$TARGET_YEAR" || {
                echo "❌ Schema validation failed for $TARGET_MONTH $TARGET_YEAR"
                FAILED=$((FAILED + 1))
                continue
              }
            fi

            # Step 6.8: Download previous incentive
            python scripts/download_previous_incentive.py --month "$TARGET_MONTH" --year "$TARGET_YEAR" || true

            # Step 7: Calculate incentives
            echo "🧮 Calculating incentives..."
            python src/step1_인센티브_계산.py --config "$TARGET_CONFIG" || {
              echo "❌ Incentive calculation failed for $TARGET_MONTH $TARGET_YEAR"
              FAILED=$((FAILED + 1))
              continue
            }

            # Step 7.5: Update AQL config
            if [ -f "scripts/auto_update_aql_config.py" ]; then
              python scripts/auto_update_aql_config.py "$TARGET_MONTH" "$TARGET_YEAR" || true
            fi

            # Step 8: Upload to Firestore
            echo "🔥 Uploading to Firestore..."
            python scripts/upload_to_firestore.py --month "$TARGET_MONTH" --year "$TARGET_YEAR" || {
              echo "❌ Firestore upload failed for $TARGET_MONTH $TARGET_YEAR"
              FAILED=$((FAILED + 1))
              continue
            }

            echo "✅ $TARGET_MONTH $TARGET_YEAR processed successfully"
            PROCESSED=$((PROCESSED + 1))
          done

          echo ""
          echo "============================================================"
          echo "📊 Pipeline Summary: $PROCESSED processed, $FAILED failed"
          echo "============================================================"

          if [ $FAILED -gt 0 ] && [ $PROCESSED -eq 0 ]; then
            echo "❌ All months failed!"
            exit 1
          fi

      # ========== Step 8.1: Upload to HR Dashboard ==========
      - name: "Step 8.1: Upload to HR Dashboard Firestore"
        if: steps.target_month.outputs.data_changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.HR_DASHBOARD_FIREBASE_SA }}
          TARGET_MONTHS: ${{ steps.target_month.outputs.target_months }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Diagnostic: distinguish "secret unregistered" vs "secret registered but empty"
          SA_LEN=${#FIREBASE_SERVICE_ACCOUNT}
          if [ "$SA_LEN" -eq 0 ]; then
            echo "⚠️ HR_DASHBOARD_FIREBASE_SA is empty (length=0). Re-enter the secret value in repo Settings → Secrets."
            exit 0
          elif [ "$SA_LEN" -lt 100 ]; then
            echo "⚠️ HR_DASHBOARD_FIREBASE_SA length=$SA_LEN — too short to be a valid service account JSON. Skipping."
            exit 0
          fi
          echo "✅ HR_DASHBOARD_FIREBASE_SA loaded (length=$SA_LEN)"

          echo "📊 Uploading to HR Dashboard (hr-dashboard-7521b)..."
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/moonkaicuzui/HR-Dashboard-V2.git /tmp/hr-v2

          HR_FAILED=0
          for ENTRY in $TARGET_MONTHS; do
            IFS=':' read -r M Y C <<< "$ENTRY"
            echo "  → HR Dashboard: $M $Y"

            PREV_M=$(python3 -c "
          months=['january','february','march','april','may','june','july','august','september','october','november','december']
          idx=months.index('$M'); print(months[(idx-1)%12])
          ")
            PREV_Y=$Y
            if [ "$PREV_M" = "december" ]; then PREV_Y=$((Y-1)); fi

            python /tmp/hr-v2/scripts/upload_to_firestore.py \
              --month "$M" --year "$Y" \
              --prev-month "$PREV_M" --prev-year "$PREV_Y" \
              --data-path "$PWD/input_files" || {
              echo "⚠️ HR Dashboard upload failed for $M $Y"
              HR_FAILED=$((HR_FAILED+1))
            }
          done

          rm -rf /tmp/hr-v2
          if [ $HR_FAILED -eq 0 ]; then
            echo "✅ HR Dashboard upload complete"
          else
            echo "⚠️ HR Dashboard: $HR_FAILED month(s) failed"
          fi

      # ========== Step 8.5: Save Input Hash ==========
      - name: "Step 8.5: Save input hash for change detection"
        if: steps.target_month.outputs.data_changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "💾 Saving input hash..."
          python scripts/check_drive_changes.py save
          echo "✅ Input hash saved"

      # ========== Step 9: Update System Status ==========
      - name: "Step 9: Update system status in Firestore"
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATA_CHANGED: ${{ steps.target_month.outputs.data_changed }}
        run: |
          echo "📊 Updating system status..."
          python3 -c "
          import os, json, datetime
          import firebase_admin
          from firebase_admin import credentials, firestore

          sa_json = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')
          data_changed = os.environ.get('DATA_CHANGED', 'true')

          if sa_json:
              sa_dict = json.loads(sa_json)
              cred = credentials.Certificate(sa_dict)
              if not firebase_admin._apps:
                  firebase_admin.initialize_app(cred, {'projectId': 'hwk-qip-incentive-dashboard'})
              db = firestore.client()

              status_data = {
                  'last_run_at': firestore.SERVER_TIMESTAMP,
                  'status': 'success',
                  'run_type': 'github_actions',
                  'commit': os.environ.get('GITHUB_SHA', 'unknown')[:8],
                  'data_changed': data_changed == 'true'
              }

              if data_changed == 'true':
                  status_data['last_data_update'] = firestore.SERVER_TIMESTAMP

              db.collection('system').document('status').set(status_data, merge=True)
              print('✅ System status updated (data_changed=' + data_changed + ')')
          else:
              print('⚠️ FIREBASE_SERVICE_ACCOUNT not set, skipping status update')
          "

      # ========== Step 9.5: Process Pending Notifications ==========
      - name: "Step 9.5: Process pending email notifications"
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "📧 Processing pending notifications..."
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            python scripts/process_notifications.py || echo "⚠️ Notification processing skipped"
          else
            echo "⚠️ SMTP credentials not set, skipping notifications"
          fi
          echo "✅ Notification processing complete"

      # ========== Step 10: Generate Selector Page ==========
      - name: "Step 10: Generate selector page"
        if: steps.target_month.outputs.data_changed == 'true'
        run: |
          echo "📄 Generating selector page..."
          if [ -f "scripts/create_month_selector.py" ]; then
            python scripts/create_month_selector.py || echo "⚠️ Selector generation skipped"
          fi
          echo "✅ Selector generation complete"

      # ========== Step 11: Deploy to GitHub Pages ==========
      - name: "Step 11: Commit and deploy"
        if: steps.target_month.outputs.data_changed == 'true'
        run: |
          echo "🚀 Deploying to GitHub Pages..."

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sync with remote safely
          git pull --rebase origin main || {
            echo "⚠️ Rebase conflict - aborting rebase and retrying with merge"
            git rebase --abort 2>/dev/null || true
            git pull origin main --no-rebase || true
          }

          # Stage web files and configs (NOT output_files or input_files)
          git add web/ config_files/ scripts/ src/ .github/ || true

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S')
            git commit -m "🔄 Auto update dashboard + Firestore sync $TIMESTAMP"

            # Push with retry (max 3 attempts)
            for i in 1 2 3; do
              if git push --force-with-lease origin main; then
                echo "✅ Push successful (attempt $i)"
                break
              else
                echo "⚠️ Push failed (attempt $i), retrying..."
                git fetch origin main
                git rebase origin/main || {
                  echo "⚠️ Rebase conflict on retry $i, aborting"
                  git rebase --abort 2>/dev/null || true
                  break
                }
                sleep 5
              fi
            done
          fi
          echo "✅ Deployment complete"

      # ========== Failure Notification ==========
      - name: "Notify on failure"
        if: failure()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "❌ Pipeline failed! Updating status..."
          python3 -c "
          import os, json
          import firebase_admin
          from firebase_admin import credentials, firestore

          sa_json = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')
          if sa_json:
              sa_dict = json.loads(sa_json)
              cred = credentials.Certificate(sa_dict)
              if not firebase_admin._apps:
                  firebase_admin.initialize_app(cred, {'projectId': 'hwk-qip-incentive-dashboard'})
              db = firestore.client()
              db.collection('system').document('status').set({
                  'last_run_at': firestore.SERVER_TIMESTAMP,
                  'status': 'failure',
                  'run_type': 'github_actions',
                  'commit': os.environ.get('GITHUB_SHA', 'unknown')[:8],
                  'error': 'Pipeline failed - check GitHub Actions logs'
              }, merge=True)
              print('⚠️ Failure status recorded in Firestore')
          " || true
