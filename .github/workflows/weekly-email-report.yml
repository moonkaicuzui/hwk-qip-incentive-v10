name: Weekly Email Report

on:
  schedule:
    - cron: '0 22 * * 0'  # Every Monday 05:00 Vietnam (UTC+7 = UTC 22:00 Sunday)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Step 1: Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Step 2: Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Step 2.1: Install dependencies"
        run: pip install firebase-admin

      - name: "Step 3: Determine current month/year"
        id: period
        run: |
          MONTH=$(python3 -c "
          import datetime
          months = ['january','february','march','april','may','june','july','august','september','october','november','december']
          print(months[datetime.datetime.now().month - 1])
          ")
          YEAR=$(date +%Y)
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "📅 Report period: $MONTH $YEAR"

      - name: "Step 4: Generate and queue reports (3 languages)"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          MONTH="${{ steps.period.outputs.month }}"
          YEAR="${{ steps.period.outputs.year }}"

          echo "📧 Queueing Korean report → ksmoon@hsvina.com"
          python scripts/generate_weekly_report.py \
            --month "$MONTH" --year "$YEAR" \
            --to "ksmoon@hsvina.com" \
            --lang ko

          echo "📧 Queueing English report → hwk_qa, bichlyrg, ksmoon"
          python scripts/generate_weekly_report.py \
            --month "$MONTH" --year "$YEAR" \
            --to "hwk_qa@hsvina.com,bichlyrg@hsvina.com,ksmoon@hsvina.com" \
            --lang en

          echo "📧 Queueing Vietnamese report → hwk_qc, bichlyrg"
          python scripts/generate_weekly_report.py \
            --month "$MONTH" --year "$YEAR" \
            --to "hwk_qc@hsvina.com,bichlyrg@hsvina.com" \
            --lang vi

          echo "✅ All reports queued in pendingNotifications"

      - name: "Step 5: Process pending notifications (send via SMTP)"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "📧 Sending queued notifications..."
          python scripts/process_notifications.py
          echo "✅ Weekly email report complete"
