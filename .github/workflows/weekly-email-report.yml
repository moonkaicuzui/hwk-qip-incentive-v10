name: Weekly Email Report

on:
  schedule:
    - cron: '0 22 * * 0'  # Every Monday 05:00 Vietnam (UTC+7 = UTC 22:00 Sunday)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Step 1: Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Step 2: Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Step 2.1: Install dependencies"
        run: pip install firebase-admin google-api-python-client google-auth-oauthlib pandas openpyxl

      - name: "Step 2.5: Download data from Google Drive (basic_manpower etc.)"
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          echo "📥 Downloading data from Google Drive..."
          python scripts/download_from_gdrive.py || echo "⚠️ gdrive base download skipped"
          # enhanced_download fetches basic_manpower / attendance / 5prs per month
          python scripts/enhanced_download.py || echo "⚠️ enhanced_download skipped"
          echo "📂 input_files snapshot:"
          ls -la input_files/ 2>/dev/null | grep -i manpower | head -5 || echo "  (no manpower files)"
          echo "✅ Download step complete"

      - name: "Step 3: Determine current month/year"
        id: period
        run: |
          MONTH=$(python3 -c "
          import datetime
          months = ['january','february','march','april','may','june','july','august','september','october','november','december']
          print(months[datetime.datetime.now().month - 1])
          ")
          YEAR=$(date +%Y)
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "📅 Report period: $MONTH $YEAR"

      - name: "Step 4: Generate and queue reports (3 languages)"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          MONTH="${{ steps.period.outputs.month }}"
          YEAR="${{ steps.period.outputs.year }}"

          echo "📧 Queueing Korean report → ksmoon@hsvina.com"
          python scripts/generate_weekly_report.py \
            --month "$MONTH" --year "$YEAR" \
            --to "ksmoon@hsvina.com" \
            --lang ko

          echo "📧 Queueing English report → hwk_qa, bichlyrg, ksmoon"
          python scripts/generate_weekly_report.py \
            --month "$MONTH" --year "$YEAR" \
            --to "hwk_qa@hsvina.com,bichlyrg@hsvina.com,ksmoon@hsvina.com" \
            --lang en

          echo "📧 Queueing Vietnamese report → hwk_qc, bichlyrg"
          python scripts/generate_weekly_report.py \
            --month "$MONTH" --year "$YEAR" \
            --to "hwk_qc@hsvina.com,bichlyrg@hsvina.com" \
            --lang vi

          echo "✅ All reports queued in pendingNotifications"

      # 이중엔진 정리 (메일 통합, 2026-06-01):
      #   폐지된 CF 월간 메일(INC-A3, scheduledIncentiveMonthlyEmail)의 수신자는
      #   config/email_recipients.report_recipients 에서 동적으로 로드됐다.
      #   통합 후 정보손실 0 가드: 그 수신자 union 을 주간 EN 보고서로 흡수한다.
      #   이미 위 Step 4 EN 대상(hwk_qa/bichlyrg/ksmoon)에 포함된 주소는 dedup.
      - name: "Step 3.5: Fold retired CF-monthly recipients into weekly EN union"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          MONTH="${{ steps.period.outputs.month }}"
          YEAR="${{ steps.period.outputs.year }}"

          # Step 4 EN 보고서가 이미 커버하는 주소 (dedup 기준).
          ALREADY_SENT="hwk_qa@hsvina.com,bichlyrg@hsvina.com,ksmoon@hsvina.com"

          echo "🔁 Loading retired CF-monthly recipients (config/email_recipients.report_recipients)..."
          EXTRA=$(python3 -c "
          import os, json
          import firebase_admin
          from firebase_admin import credentials, firestore

          sa = os.environ.get('FIREBASE_SERVICE_ACCOUNT', '')
          if not sa:
              print('')
          else:
              cred = credentials.Certificate(json.loads(sa))
              if not firebase_admin._apps:
                  firebase_admin.initialize_app(cred, {'projectId': 'hwk-qip-incentive-dashboard'})
              db = firestore.client()
              already = set(e.strip().lower() for e in '$ALREADY_SENT'.split(',') if e.strip())
              extra = []
              try:
                  doc = db.collection('config').document('email_recipients').get()
                  if doc.exists:
                      data = doc.to_dict() or {}
                      for e in (data.get('report_recipients') or []):
                          if isinstance(e, str) and '@' in e and e.strip().lower() not in already:
                              extra.append(e.strip())
                              already.add(e.strip().lower())
              except Exception as ex:
                  import sys
                  print('', end='')
                  sys.stderr.write('config read failed: %s\n' % ex)
              print(','.join(extra))
          ") || EXTRA=""

          if [ -n "$EXTRA" ]; then
            echo "📧 Folding extra CF-monthly recipients into weekly EN report → $EXTRA"
            python scripts/generate_weekly_report.py \
              --month "$MONTH" --year "$YEAR" \
              --to "$EXTRA" \
              --lang en
          else
            echo "ℹ️ No extra CF-monthly recipients (all already covered by Step 4 union)"
          fi
          echo "✅ Recipient union complete"

      - name: "Step 4.5: Data verification — queue alert if issues found"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "🔍 Running data verification..."
          python scripts/verify_data_issues.py \
            --month "${{ steps.period.outputs.month }}" \
            --year "${{ steps.period.outputs.year }}"
          echo "✅ Data verification complete"

      - name: "Step 5: Process pending notifications (send via SMTP)"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          echo "📧 Sending queued notifications..."
          python scripts/process_notifications.py
          echo "✅ Weekly email report complete"
