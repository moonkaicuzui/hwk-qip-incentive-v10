<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Issues</title>
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #eff6ff;
      --color-success: #059669;
      --color-warning: #d97706;
      --color-danger: #dc2626;
      --color-info: #0891b2;
      --color-bg: #f9fafb;
      --color-surface: #ffffff;
      --color-text: #111827;
      --color-text-secondary: #4b5563;
      --color-text-muted: #9ca3af;
      --color-border: #e5e7eb;
      --color-border-light: #f3f4f6;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      /* Status colors */
      --status-open-bg: #fef2f2;
      --status-open-text: #dc2626;
      --status-open-border: #fecaca;
      --status-progress-bg: #fefce8;
      --status-progress-text: #ca8a04;
      --status-progress-border: #fef08a;
      --status-resolved-bg: #f0fdf4;
      --status-resolved-text: #16a34a;
      --status-resolved-border: #bbf7d0;
      --status-closed-bg: #f3f4f6;
      --status-closed-text: #6b7280;
      --status-closed-border: #d1d5db;
      /* Priority colors */
      --priority-high: #dc2626;
      --priority-medium: #f59e0b;
      --priority-low: #6b7280;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 16px;
    }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-text-muted); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-secondary); }

    /* ===== Layout ===== */
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ===== Header ===== */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--color-primary); }
    .back-link svg { width: 16px; height: 16px; }
    .header-divider {
      width: 1px;
      height: 24px;
      background: var(--color-border);
    }
    .page-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }
    .page-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ===== Language Switcher ===== */
    .lang-switcher {
      display: flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-surface);
    }
    .lang-btn {
      padding: 6px 14px;
      font-size: 0.8125rem;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .lang-btn:not(:last-child) {
      border-right: 1px solid var(--color-border);
    }
    .lang-btn:hover { background: var(--color-border-light); }
    .lang-btn.active {
      background: var(--color-primary);
      color: #fff;
    }

    /* ===== Action Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.4;
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary {
      background: var(--color-primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-secondary {
      background: var(--color-surface);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
    }
    .btn-secondary:hover { background: var(--color-border-light); }

    /* ===== Pipeline Status Cards ===== */
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .pipeline-card {
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      border: 1px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .pipeline-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .pipeline-card .pipeline-label {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .pipeline-card .pipeline-count {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .pipeline-open {
      background: var(--status-open-bg);
      border-color: var(--status-open-border);
    }
    .pipeline-open .pipeline-label,
    .pipeline-open .pipeline-count { color: var(--status-open-text); }
    .pipeline-progress {
      background: var(--status-progress-bg);
      border-color: var(--status-progress-border);
    }
    .pipeline-progress .pipeline-label,
    .pipeline-progress .pipeline-count { color: var(--status-progress-text); }
    .pipeline-resolved {
      background: var(--status-resolved-bg);
      border-color: var(--status-resolved-border);
    }
    .pipeline-resolved .pipeline-label,
    .pipeline-resolved .pipeline-count { color: var(--status-resolved-text); }
    .pipeline-closed {
      background: var(--status-closed-bg);
      border-color: var(--status-closed-border);
    }
    .pipeline-closed .pipeline-label,
    .pipeline-closed .pipeline-count { color: var(--status-closed-text); }

    /* ===== Issue List ===== */
    .issue-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .issue-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px 24px;
      border-left: 4px solid transparent;
      transition: box-shadow 0.15s, transform 0.15s;
      position: relative;
    }
    .issue-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .issue-card.status-open { border-left-color: var(--status-open-text); }
    .issue-card.status-in_progress { border-left-color: var(--status-progress-text); }
    .issue-card.status-resolved { border-left-color: var(--status-resolved-text); }
    .issue-card.status-closed { border-left-color: var(--status-closed-text); }

    .issue-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .issue-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--color-text);
      line-height: 1.4;
      flex: 1;
      min-width: 0;
    }
    .issue-description {
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .issue-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .issue-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .issue-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }
    .issue-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .issue-meta-item svg { width: 14px; height: 14px; }

    /* ===== Badges ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      font-size: 0.6875rem;
      font-weight: 600;
      border-radius: 9999px;
      line-height: 1.6;
      white-space: nowrap;
    }
    .badge-system {
      background: var(--color-primary-light);
      color: var(--color-primary);
      border: 1px solid #bfdbfe;
    }
    .badge-system::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }
    .badge-category {
      background: var(--color-border-light);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
    }
    .badge-priority-high {
      color: var(--priority-high);
      background: #fef2f2;
    }
    .badge-priority-medium {
      color: var(--priority-medium);
      background: #fffbeb;
    }
    .badge-priority-low {
      color: var(--priority-low);
      background: var(--color-border-light);
    }

    /* ===== Status Dropdown ===== */
    .status-dropdown-wrapper {
      position: relative;
      flex-shrink: 0;
    }
    .status-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
      line-height: 1.6;
    }
    .status-btn:hover { opacity: 0.85; }
    .status-btn svg { width: 14px; height: 14px; }
    .status-btn.status-open {
      background: var(--status-open-bg);
      color: var(--status-open-text);
      border: 1px solid var(--status-open-border);
    }
    .status-btn.status-in_progress {
      background: var(--status-progress-bg);
      color: var(--status-progress-text);
      border: 1px solid var(--status-progress-border);
    }
    .status-btn.status-resolved {
      background: var(--status-resolved-bg);
      color: var(--status-resolved-text);
      border: 1px solid var(--status-resolved-border);
    }
    .status-btn.status-closed {
      background: var(--status-closed-bg);
      color: var(--status-closed-text);
      border: 1px solid var(--status-closed-border);
    }
    .status-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 20;
      min-width: 140px;
      padding: 4px;
      animation: fadeIn 0.12s ease-out;
    }
    .status-menu.show { display: block; }
    .status-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      font-size: 0.8125rem;
      font-weight: 500;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--color-text);
      transition: background 0.1s;
    }
    .status-menu-item:hover { background: var(--color-border-light); }
    .status-menu-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-menu-item .dot.open { background: var(--status-open-text); }
    .status-menu-item .dot.in_progress { background: var(--status-progress-text); }
    .status-menu-item .dot.resolved { background: var(--status-resolved-text); }
    .status-menu-item .dot.closed { background: var(--status-closed-text); }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s ease-out;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.2s ease-out;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 0;
    }
    .modal-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-text);
    }
    .modal-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--color-text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .modal-close:hover {
      background: var(--color-border-light);
      color: var(--color-text-secondary);
    }
    .modal-close svg { width: 20px; height: 20px; }
    .modal-body { padding: 20px 24px; }
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 24px 24px;
    }

    /* ===== Form ===== */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 6px;
    }
    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.875rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--color-text-muted);
    }
    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-muted);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }
    .empty-state p {
      font-size: 0.875rem;
      line-height: 1.6;
    }

    /* ===== Loading State ===== */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-muted);
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 12px;
    }

    /* ===== Toast ===== */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.2s ease-out;
      max-width: 360px;
    }
    .toast-success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .toast-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* ===== Animations ===== */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .page-container { padding: 16px 16px 40px; }
      .page-header { gap: 12px; }
      .page-title { font-size: 1.25rem; }
      .pipeline-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .pipeline-card { padding: 12px 16px; }
      .pipeline-card .pipeline-count { font-size: 1.5rem; }
      .issue-card { padding: 16px; }
      .issue-bottom-row { flex-direction: column; align-items: flex-start; }
      .issue-meta { margin-top: 4px; }
      .form-row { grid-template-columns: 1fr; }
      .modal { max-width: 100%; margin: 0 8px; }
      .page-header-right { width: 100%; justify-content: space-between; }
      .header-divider { display: none; }
    }
    @media (max-width: 480px) {
      .pipeline-grid { grid-template-columns: repeat(2, 1fr); }
      .page-title { font-size: 1.125rem; }
      .lang-btn { padding: 5px 10px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <!-- ===== Toast Container ===== -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ===== Modal: Create Issue ===== -->
  <div id="createModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title" data-i18n="modal.title"></h2>
        <button class="modal-close" onclick="closeModal()" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="createForm" onsubmit="handleCreate(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" data-i18n="form.title"></label>
            <input class="form-input" id="formTitle" required maxlength="200" data-i18n-placeholder="form.titlePlaceholder" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.description"></label>
            <textarea class="form-textarea" id="formDescription" data-i18n-placeholder="form.descPlaceholder"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" data-i18n="form.category"></label>
              <select class="form-select" id="formCategory">
                <option value="bug" data-i18n="category.bug"></option>
                <option value="feature" data-i18n="category.feature"></option>
                <option value="improvement" data-i18n="category.improvement"></option>
                <option value="other" data-i18n="category.other"></option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" data-i18n="form.priority"></label>
              <select class="form-select" id="formPriority">
                <option value="medium" data-i18n="priority.medium"></option>
                <option value="high" data-i18n="priority.high"></option>
                <option value="low" data-i18n="priority.low"></option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="form.author"></label>
            <input class="form-input" id="formAuthor" required maxlength="100" data-i18n-placeholder="form.authorPlaceholder" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()" data-i18n="btn.cancel"></button>
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="btn.create"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Page Content ===== -->
  <div class="page-container">
    <!-- Header -->
    <header class="page-header">
      <div class="page-header-left">
        <a href="/" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          <span data-i18n="nav.backToDashboard"></span>
        </a>
        <div class="header-divider"></div>
        <h1 class="page-title" data-i18n="page.title"></h1>
      </div>
      <div class="page-header-right">
        <div class="lang-switcher">
          <button class="lang-btn" onclick="setLang('ko')">한국어</button>
          <button class="lang-btn" onclick="setLang('en')">English</button>
          <button class="lang-btn" onclick="setLang('vi')">Tiếng Việt</button>
        </div>

        'toast.updated': 'Trạng thái đã được cập nhật.',
        'toast.error': 'Đã xảy ra lỗi.',
      },
    };

    let currentLang = localStorage.getItem('system-issues-lang') || 'ko';
    let issues = [];
    let db = null;

    // ─── Firebase Init ─────────────────────────────────────────────────
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      updateDoc,
      doc,
      query,
      orderBy,
      serverTimestamp,
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const app = initializeApp({
      apiKey: CONFIG.apiKey,
      authDomain: CONFIG.authDomain,
      projectId: CONFIG.projectId,
    });
    db = getFirestore(app);

    // ─── i18n Functions ────────────────────────────────────────────────
    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N['ko'][key] || key;
    }

    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
      });
      // Update select options
      document.querySelectorAll('option[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      // Update language switcher active state
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(
          currentLang === 'ko' ? '한국어' : currentLang === 'en' ? 'English' : 'Tiếng Việt'
        ));
      });
      // Update page title
      document.title = t('page.title');
    }

    window.setLang = function(lang) {
      currentLang = lang;
      localStorage.setItem('system-issues-lang', lang);
      applyI18n();
      renderIssues();
    };

    // ─── Toast ─────────────────────────────────────────────────────────
    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icon = type === 'success'
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
      toast.innerHTML = icon + '<span>' + message + '</span>';
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(40px)';
        toast.style.transition = 'all 0.2s ease-in';
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    };

    // ─── Modal ─────────────────────────────────────────────────────────
    window.openModal = function() {
      document.getElementById('createModal').classList.add('show');
      document.getElementById('formTitle').focus();
    };

    window.closeModal = function() {
      document.getElementById('createModal').classList.remove('show');
      document.getElementById('createForm').reset();
    };

    // ─── Status Dropdown ───────────────────────────────────────────────
    let activeDropdown = null;

    window.toggleStatusMenu = function(issueId, event) {
      event.stopPropagation();
      const menu = document.getElementById('statusMenu-' + issueId);
      if (!menu) return;

      // Close any other open menus
      if (activeDropdown && activeDropdown !== menu) {
        activeDropdown.classList.remove('show');
      }

      menu.classList.toggle('show');
      activeDropdown = menu.classList.contains('show') ? menu : null;
    };

    window.changeStatus = async function(issueId, newStatus) {
      try {
        const ref = doc(db, CONFIG.collectionName, issueId);
        await updateDoc(ref, {
          status: newStatus,
          updatedAt: serverTimestamp(),
        });
        // Update local data
        const issue = issues.find(i => i.id === issueId);
        if (issue) issue.status = newStatus;
        renderIssues();
        showToast(t('toast.updated'));
      } catch (err) {
        console.error('Status update error:', err);
        showToast(t('toast.error'), 'error');
      }
      // Close menu
      if (activeDropdown) {
        activeDropdown.classList.remove('show');
        activeDropdown = null;
      }
    };

    // Close dropdown on outside click
    document.addEventListener('click', () => {
      if (activeDropdown) {
        activeDropdown.classList.remove('show');
        activeDropdown = null;
      }
    });

    // Close modal on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        if (activeDropdown) {
          activeDropdown.classList.remove('show');
          activeDropdown = null;
        }
      }
    });

    // ─── Create Issue ──────────────────────────────────────────────────
    window.handleCreate = async function(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const data = {
        title: document.getElementById('formTitle').value.trim(),
        description: document.getElementById('formDescription').value.trim(),
        category: document.getElementById('formCategory').value,
        priority: document.getElementById('formPriority').value,
        author: document.getElementById('formAuthor').value.trim(),
        status: 'open',
        system: CONFIG.systemLabel,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
      };

      try {
        await addDoc(collection(db, CONFIG.collectionName), data);
        closeModal();
        showToast(t('toast.created'));
        await loadIssues();
      } catch (err) {
        console.error('Create error:', err);
        showToast(t('toast.error'), 'error');
      } finally {
        submitBtn.disabled = false;
      }
    };

    // ─── Load Issues ───────────────────────────────────────────────────
    window.loadIssues = async function() {
      const listEl = document.getElementById('issueList');
      listEl.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>${t('loading')}</p>
        </div>
      `;

      try {
        const q = query(
          collection(db, CONFIG.collectionName),
          orderBy('createdAt', 'desc')
        );
        const snapshot = await getDocs(q);
        issues = snapshot.docs.map(d => {
          const data = d.data();
          return {
            id: d.id,
            ...data,
            status: (data.status || 'open').toLowerCase().replace(/[\s-]/g, '_'),
            category: (data.category || data.type || data.feedbackType || 'other').toLowerCase().replace(/[\s-]/g, '_'),
            priority: (data.priority || data.severity || 'medium').toLowerCase(),
          };
        });
        renderIssues();
      } catch (err) {
        console.error('Load error:', err);
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <p style="color: var(--color-danger);">${err.message || t('toast.error')}</p>
          </div>
        `;
      }
    };

    // ─── Render ────────────────────────────────────────────────────────
    function renderIssues() {
      // Pipeline counts
      const counts = { open: 0, in_progress: 0, resolved: 0, closed: 0 };
      issues.forEach(issue => {
        if (counts[issue.status] !== undefined) counts[issue.status]++;
      });
      document.getElementById('countOpen').textContent = counts.open;
      document.getElementById('countProgress').textContent = counts.in_progress;
      document.getElementById('countResolved').textContent = counts.resolved;
      document.getElementById('countClosed').textContent = counts.closed;

      // Issue list
      const listEl = document.getElementById('issueList');

      if (issues.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <p><strong>${t('empty.title')}</strong></p>
            <p>${t('empty.desc')}</p>
          </div>
        `;
        return;
      }

      const statuses = ['open', 'in_progress', 'resolved', 'closed'];
      const categoryIcons = {
        bug: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
        feature: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
        improvement: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
        other: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
      };

      listEl.innerHTML = '<div class="issue-list">' + issues.map(issue => {
        const statusLabel = t('status.' + issue.status);
        const categoryLabel = t('category.' + (issue.category || 'other'));
        const priorityLabel = t('priority.' + (issue.priority || 'medium'));
        const priorityClass = 'badge-priority-' + (issue.priority || 'medium');
        const createdDate = formatDate(issue.createdAt);
        const catIcon = categoryIcons[issue.category] || categoryIcons.other;

        const statusMenuHtml = statuses.map(s =>
          `<button type="button" class="status-menu-item" onclick="changeStatus('${issue.id}','${s}')">
            <span class="dot ${s}"></span>
            ${t('status.' + s)}
          </button>`
        ).join('');

        return `
          <div class="issue-card status-${issue.status}">
            <div class="issue-top-row">
              <div class="issue-title">${escapeHtml(issue.title || '')}</div>
              <div class="status-dropdown-wrapper">
                <button class="status-btn status-${issue.status}" onclick="toggleStatusMenu('${issue.id}', event)">
                  ${statusLabel}
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="status-menu" id="statusMenu-${issue.id}">
                  ${statusMenuHtml}
                </div>
              </div>
            </div>
            ${issue.description ? `<div class="issue-description">${escapeHtml(issue.description)}</div>` : ''}
            <div class="issue-bottom-row">
              <div class="issue-badges">
                <span class="badge badge-system">${escapeHtml(issue.system || CONFIG.systemLabel)}</span>
                <span class="badge badge-category">${categoryLabel}</span>
                <span class="badge ${priorityClass}">${priorityLabel}</span>
              </div>
              <div class="issue-meta">
                <span class="issue-meta-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  ${escapeHtml(issue.author || '-')}
                </span>
                <span class="issue-meta-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  ${createdDate}
                </span>
              </div>
            </div>
          </div>
        `;
      }).join('') + '</div>';
    }

    // ─── Utilities ─────────────────────────────────────────────────────
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatDate(timestamp) {
      if (!timestamp) return '-';
      let date;
      if (timestamp.toDate) {
        date = timestamp.toDate();
      } else if (timestamp.seconds) {
        date = new Date(timestamp.seconds * 1000);
      } else {
        date = new Date(timestamp);
      }
      if (isNaN(date.getTime())) return '-';
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${m}. ${d}.`;
    }

    // DEPRECATED: This page uses incompatible status schema with feedback.html.
    // Redirect to the main feedback page.
    (function() {
      var msg = {

        en: 'This page is deprecated.\nRedirecting to System Feedback page.',
        vi: 'Trang này không còn được sử dụng.\nChuyển hướng đến trang System Feedback.'
      };
      var lang = (navigator.language || 'en').substring(0, 2);
      alert(msg[lang] || msg.en);
      window.location.href = 'feedback.html';
    })();
  </script>
