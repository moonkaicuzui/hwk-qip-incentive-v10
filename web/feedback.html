<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWK QIP - System Feedback</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e3a5f'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='white' font-size='20' font-family='Arial'%3EQ%3C/text%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #1a237e;
            --primary: #283593;
            --primary-light: #3949ab;
            --accent: #f59e0b;
            --surface: #f4f6f9;
            --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
            --card-shadow-hover: 0 4px 20px rgba(0,0,0,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { min-height:100vh; background:var(--surface); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif; display:flex; flex-direction:column; }

        /* Header */
        .page-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%);
            color: #fff; padding: 0; box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            position: sticky; top: 0; z-index: 100;
        }
        .header-inner { max-width:1200px; margin:0 auto; padding:1rem 1.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem; }
        .header-left { display:flex; align-items:center; gap:0.75rem; }
        .header-logo { width:38px; height:38px; background:rgba(255,255,255,0.15); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2rem; }
        .header-title { font-size:1.15rem; font-weight:700; letter-spacing:-0.02em; }
        .header-subtitle { font-size:0.75rem; opacity:0.7; }
        .header-right { display:flex; align-items:center; gap:0.5rem; }
        .btn-header { background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.2); border-radius:8px; padding:0.4rem 0.9rem; font-size:0.8rem; cursor:pointer; transition:all 0.2s; text-decoration:none; }
        .btn-header:hover { background:rgba(255,255,255,0.22); color:#fff; }

        /* Main */
        .main-content { max-width:1200px; margin:0 auto; padding:2rem 1.5rem; width:100%; flex:1; }

        /* Tabs */
        .tab-bar { display:flex; gap:0.5rem; margin-bottom:1.5rem; border-bottom:2px solid #e2e8f0; padding-bottom:0; }
        .tab-btn { padding:0.6rem 1.2rem; border:none; background:none; color:#64748b; font-weight:600; font-size:0.9rem; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; transition:all 0.2s; }
        .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
        .tab-btn:hover:not(.active) { color:var(--primary-light); }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Stats */
        .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:1.5rem; }
        .stat-card { background:#fff; border-radius:12px; padding:1rem 1.25rem; box-shadow:var(--card-shadow); text-align:center; }
        .stat-value { font-size:1.75rem; font-weight:700; color:var(--primary-dark); }
        .stat-label { font-size:0.75rem; color:#64748b; margin-top:0.25rem; }

        /* Form */
        .form-card { background:#fff; border-radius:14px; padding:2rem; box-shadow:var(--card-shadow); }
        .form-card label { font-weight:600; font-size:0.85rem; color:#334155; margin-bottom:0.35rem; }
        .form-card .form-control, .form-card .form-select { border-radius:8px; border:1.5px solid #e2e8f0; font-size:0.9rem; }
        .form-card .form-control:focus, .form-card .form-select:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(57,73,171,0.1); }
        .btn-submit { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:0.7rem 2rem; font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.2s; }
        .btn-submit:hover { background:var(--primary-dark); }
        .btn-submit:disabled { opacity:0.6; cursor:not-allowed; }

        /* Feedback cards */
        .feedback-card { background:#fff; border-radius:12px; padding:1.25rem; box-shadow:var(--card-shadow); margin-bottom:1rem; cursor:pointer; transition:all 0.2s; border-left:4px solid transparent; }
        .feedback-card:hover { box-shadow:var(--card-shadow-hover); transform:translateY(-2px); }
        .feedback-card.type-bug { border-left-color:#ef4444; }
        .feedback-card.type-improvement { border-left-color:#3b82f6; }
        .feedback-card.type-question { border-left-color:#8b5cf6; }
        .feedback-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.5rem; }
        .feedback-title { font-weight:600; font-size:0.95rem; color:#1e293b; }
        .feedback-meta { font-size:0.75rem; color:#94a3b8; }
        .feedback-desc { font-size:0.85rem; color:#475569; line-height:1.5; }

        /* Badges */
        .badge-type { font-size:0.7rem; padding:0.2rem 0.6rem; border-radius:20px; font-weight:600; }
        .badge-bug { background:#fef2f2; color:#dc2626; }
        .badge-improvement { background:#eff6ff; color:#2563eb; }
        .badge-question { background:#f5f3ff; color:#7c3aed; }
        .badge-status { font-size:0.7rem; padding:0.2rem 0.6rem; border-radius:20px; font-weight:600; }
        .badge-pending { background:#fef3c7; color:#d97706; }
        .badge-accepted { background:#dbeafe; color:#2563eb; }
        .badge-completed { background:#d1fae5; color:#059669; }
        .badge-approved { background:#e0e7ff; color:#4338ca; }

        /* Priority */
        .badge-low { background:#f0fdf4; color:#16a34a; }
        .badge-medium { background:#fef9c3; color:#ca8a04; }
        .badge-high { background:#fff7ed; color:#ea580c; }
        .badge-critical { background:#fef2f2; color:#dc2626; }

        /* Modal */
        .modal-content { border-radius:16px; border:none; }
        .modal-header { background:linear-gradient(135deg, var(--primary-dark), var(--primary)); color:#fff; border-radius:16px 16px 0 0; padding:1.25rem 1.5rem; }
        .modal-header .btn-close { filter:brightness(0) invert(1); }
        .timeline-item { display:flex; gap:0.75rem; padding:0.75rem 0; border-bottom:1px solid #f1f5f9; }
        .timeline-dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0; }
        .timeline-text { font-size:0.82rem; color:#475569; }
        .timeline-date { font-size:0.72rem; color:#94a3b8; }

        /* Empty state */
        .empty-state { text-align:center; padding:3rem; color:#94a3b8; }
        .empty-state i { font-size:3rem; margin-bottom:1rem; }

        /* Filter bar */
        .filter-bar { display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; }
        .filter-btn { padding:0.35rem 0.9rem; border:1.5px solid #e2e8f0; background:#fff; color:#64748b; border-radius:20px; font-size:0.8rem; font-weight:500; cursor:pointer; transition:all 0.2s; }
        .filter-btn.active { border-color:var(--primary); background:var(--primary); color:#fff; }

        @media (max-width:768px) {
            .stats-row { grid-template-columns:repeat(2,1fr); }
            .header-inner { padding:0.75rem 1rem; }
            .main-content { padding:1.25rem 1rem; }
        }
        @media (max-width:576px) {
            .stats-row { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="page-header">
        <div class="header-inner">
            <div class="header-left">
                <div class="header-logo">Q</div>
                <div>
                    <div class="header-title">System Feedback</div>
                    <div class="header-subtitle">Issue Report & Improvement Request</div>
                </div>
            </div>
            <div class="header-right">
                <a href="selector.html" class="btn-header"><i class="fas fa-arrow-left me-1"></i> Dashboard</a>
                <span class="btn-header" id="userEmail" style="cursor:default;"></span>
                <button class="btn-header" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Stats -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-value" id="statPending" style="color:#d97706">0</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-value" id="statAccepted" style="color:#2563eb">0</div><div class="stat-label">Accepted</div></div>
            <div class="stat-card"><div class="stat-value" id="statCompleted" style="color:#059669">0</div><div class="stat-label">Completed / Approved</div></div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="list"><i class="fas fa-list me-1"></i> Feedback List</button>
            <button class="tab-btn" data-tab="submit"><i class="fas fa-plus-circle me-1"></i> New Request</button>
        </div>

        <!-- Tab: List -->
        <div class="tab-content active" id="tab-list">
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="accepted">Accepted</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="approved">Approved</button>
            </div>
            <div id="feedbackList">
                <div class="empty-state"><i class="fas fa-inbox"></i><p>Loading...</p></div>
            </div>
        </div>

        <!-- Tab: Submit -->
        <div class="tab-content" id="tab-submit">
            <div class="form-card">
                <h5 style="font-weight:700; color:var(--primary-dark); margin-bottom:1.5rem;"><i class="fas fa-paper-plane me-2"></i>Submit New Request</h5>
                <form id="feedbackForm" onsubmit="submitFeedback(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Type <span class="text-danger">*</span></label>
                            <select class="form-select" id="fbType" required>
                                <option value="">-- Select --</option>
                                <option value="bug">Bug Report</option>
                                <option value="improvement">Improvement Request</option>
                                <option value="question">Question</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Priority</label>
                            <select class="form-select" id="fbPriority">
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                                <option value="high">High</option>
                                <option value="critical">Critical</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Your Email (for notification) <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="fbReporterEmail" required placeholder="your.email@hsvina.com">
                            <small class="text-muted">You will receive an email notification when this issue is resolved.</small>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fbTitle" maxlength="100" required placeholder="Brief description of the issue or request">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="fbDescription" rows="5" maxlength="2000" required placeholder="Detailed description..."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label"><i class="fas fa-image me-1"></i>Attachments</label>
                            <div id="attachDropZone" style="border:2px dashed #cbd5e1; border-radius:10px; padding:1.5rem; text-align:center; cursor:pointer; transition:all 0.2s; background:#fafbfc;">
                                <input type="file" id="fbAttachments" multiple accept="image/*" style="display:none;">
                                <div style="color:#94a3b8;">
                                    <i class="fas fa-cloud-upload-alt" style="font-size:1.5rem; margin-bottom:0.5rem; display:block;"></i>
                                    Click or drag images here (max 3 files, 5MB each)
                                </div>
                            </div>
                            <div id="attachPreview" style="display:flex; gap:0.75rem; margin-top:0.75rem; flex-wrap:wrap;"></div>
                        </div>
                        <div class="col-12 text-end">
                            <button type="submit" class="btn-submit" id="btnSubmit">
                                <i class="fas fa-paper-plane me-1"></i> Submit
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Feedback Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody" style="padding:1.5rem;">
                    <!-- Filled by JS -->
                </div>
                <div class="modal-footer" id="modalFooter" style="border-top:1px solid #f1f5f9; padding:1rem 1.5rem;">
                    <!-- Action buttons filled by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    // ============================================================
    // System Feedback Page - HWK QIP Incentive V10
    // ============================================================
    const COLLECTION = 'systemFeedback';
    const MAX_FILES = 3;
    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB
    const MAX_IMAGE_DIMENSION = 800; // Resize images to max 800px
    const JPEG_QUALITY = 0.7;
    let currentUser = null;
    let currentUserIsAdmin = false;
    let allFeedbacks = [];
    let currentFilter = 'all';
    let selectedFiles = [];

    // ============ Init ============
    checkAuth().then(function(user) {
        currentUser = user;
        document.getElementById('userEmail').textContent = user.email;
        // Auto-fill reporter email field with logged-in user's email
        var emailField = document.getElementById('fbReporterEmail');
        if (emailField && user.email) emailField.value = user.email;
        currentUserIsAdmin = isAdmin(user);
        loadFeedbacks();
    });

    // ============ Tabs ============
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // ============ Filters ============
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderFeedbacks();
        });
    });

    // ============ Load ============
    function loadFeedbacks() {
        db.collection(COLLECTION).orderBy('createdAt', 'desc').onSnapshot(function(snapshot) {
            allFeedbacks = [];
            snapshot.forEach(function(doc) {
                allFeedbacks.push(Object.assign({ id: doc.id }, doc.data()));
            });
            updateStats();
            renderFeedbacks();
        }, function(err) {
            console.error('Load error:', err);
            document.getElementById('feedbackList').innerHTML =
                '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load feedback data</p></div>';
        });
    }

    // ============ Stats ============
    function updateStats() {
        var pending = 0, accepted = 0, completed = 0;
        allFeedbacks.forEach(function(f) {
            if (f.status === 'pending') pending++;
            else if (f.status === 'accepted') accepted++;
            else if (f.status === 'completed' || f.status === 'approved') completed++;
        });
        document.getElementById('statTotal').textContent = allFeedbacks.length;
        document.getElementById('statPending').textContent = pending;
        document.getElementById('statAccepted').textContent = accepted;
        document.getElementById('statCompleted').textContent = completed;
    }

    // ============ Render ============
    function renderFeedbacks() {
        var container = document.getElementById('feedbackList');
        var filtered = currentFilter === 'all' ? allFeedbacks : allFeedbacks.filter(function(f) { return f.status === currentFilter; });

        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No feedback found</p></div>';
            return;
        }

        container.innerHTML = filtered.map(function(f) {
            var typeClass = 'type-' + (f.type || 'bug');
            var typeBadge = '<span class="badge-type badge-' + (f.type || 'bug') + '">' + (f.type || 'bug').toUpperCase() + '</span>';
            var statusBadge = '<span class="badge-status badge-' + (f.status || 'pending') + '">' + (f.status || 'pending').toUpperCase() + '</span>';
            var priorityBadge = f.priority ? '<span class="badge-type badge-' + f.priority + '">' + f.priority.toUpperCase() + '</span>' : '';
            var date = f.createdAt ? formatDate(f.createdAt) : '';
            var creator = f.createdBy ? f.createdBy.email : 'Unknown';

            var attachIcon = (f.attachments && f.attachments.length > 0) ? '<span style="color:#64748b; font-size:0.8rem; margin-left:0.5rem;"><i class="fas fa-paperclip"></i> ' + f.attachments.length + '</span>' : '';

            return '<div class="feedback-card ' + typeClass + '" onclick="showDetail(\'' + f.id + '\')">' +
                '<div class="feedback-header">' +
                    '<div class="feedback-title">' + escapeHtml(f.title || 'Untitled') + attachIcon + '</div>' +
                    '<div style="display:flex;gap:0.4rem;align-items:center;">' + priorityBadge + ' ' + typeBadge + ' ' + statusBadge + '</div>' +
                '</div>' +
                '<div class="feedback-desc">' + escapeHtml((f.description || '').substring(0, 150)) + (f.description && f.description.length > 150 ? '...' : '') + '</div>' +
                '<div class="feedback-meta mt-2"><i class="fas fa-user me-1"></i>' + escapeHtml(creator) + ' &middot; <i class="fas fa-clock me-1"></i>' + date + '</div>' +
            '</div>';
        }).join('');
    }

    // ============ Attachments ============
    (function initAttachments() {
        var dropZone = document.getElementById('attachDropZone');
        var fileInput = document.getElementById('fbAttachments');

        dropZone.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function() { handleFiles(fileInput.files); });

        dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.style.borderColor = '#3949ab'; dropZone.style.background = '#eef2ff'; });
        dropZone.addEventListener('dragleave', function() { dropZone.style.borderColor = '#cbd5e1'; dropZone.style.background = '#fafbfc'; });
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.style.borderColor = '#cbd5e1'; dropZone.style.background = '#fafbfc';
            handleFiles(e.dataTransfer.files);
        });
    })();

    function handleFiles(fileList) {
        Array.from(fileList).forEach(function(file) {
            if (!file.type.startsWith('image/')) { alert(file.name + ' is not an image.'); return; }
            if (file.size > MAX_FILE_SIZE) { alert(file.name + ' exceeds 5MB limit.'); return; }
            if (selectedFiles.length >= MAX_FILES) { alert('Maximum ' + MAX_FILES + ' files allowed.'); return; }
            selectedFiles.push(file);
        });
        renderPreviews();
    }

    function renderPreviews() {
        var container = document.getElementById('attachPreview');
        container.innerHTML = '';
        selectedFiles.forEach(function(file, idx) {
            var wrapper = document.createElement('div');
            wrapper.style.cssText = 'position:relative; width:100px; height:100px; border-radius:8px; overflow:hidden; border:1.5px solid #e2e8f0;';
            var img = document.createElement('img');
            img.style.cssText = 'width:100%; height:100%; object-fit:cover;';
            img.src = URL.createObjectURL(file);
            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.style.cssText = 'position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;';
            removeBtn.innerHTML = '&times;';
            removeBtn.onclick = function() { selectedFiles.splice(idx, 1); renderPreviews(); };
            wrapper.appendChild(img);
            wrapper.appendChild(removeBtn);
            container.appendChild(wrapper);
        });
    }

    function resizeAndCompressImage(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var canvas = document.createElement('canvas');
                    var w = img.width, h = img.height;
                    if (w > MAX_IMAGE_DIMENSION || h > MAX_IMAGE_DIMENSION) {
                        if (w > h) { h = Math.round(h * MAX_IMAGE_DIMENSION / w); w = MAX_IMAGE_DIMENSION; }
                        else { w = Math.round(w * MAX_IMAGE_DIMENSION / h); h = MAX_IMAGE_DIMENSION; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    var dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
                    resolve(dataUrl);
                };
                img.onerror = function() { reject(new Error('Failed to load image: ' + file.name)); };
                img.src = e.target.result;
            };
            reader.onerror = function() { reject(new Error('Failed to read file: ' + file.name)); };
            reader.readAsDataURL(file);
        });
    }

    async function convertAttachmentsToBase64() {
        var attachments = [];
        for (var i = 0; i < selectedFiles.length; i++) {
            var file = selectedFiles[i];
            try {
                var dataUrl = await resizeAndCompressImage(file);
                attachments.push({ url: dataUrl, name: file.name, type: 'base64' });
            } catch(err) {
                console.error('Image conversion failed:', err.message);
                attachments.push({ name: file.name, error: err.message, failed: true });
            }
        }
        return attachments;
    }

    // ============ Submit ============
    async function submitFeedback(e) {
        e.preventDefault();
        var btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Submitting...';

        try {
            // Create feedback doc first (to get ID)
            var data = {
                type: document.getElementById('fbType').value,
                priority: document.getElementById('fbPriority').value,
                title: document.getElementById('fbTitle').value.trim(),
                description: document.getElementById('fbDescription').value.trim(),
                reporterEmail: document.getElementById('fbReporterEmail').value.trim(),
                status: 'pending',
                attachments: [],
                createdBy: {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    displayName: currentUser.displayName || currentUser.email
                },
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            var docRef = await db.collection(COLLECTION).add(data);

            // Convert and attach images as base64
            var uploadWarning = '';
            if (selectedFiles.length > 0) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Processing images...';
                var attachments = await convertAttachmentsToBase64();
                var successAttachments = attachments.filter(function(a) { return !a.failed; });
                var failedAttachments = attachments.filter(function(a) { return a.failed; });
                if (successAttachments.length > 0) {
                    await docRef.update({ attachments: successAttachments });
                }
                if (failedAttachments.length > 0) {
                    uploadWarning = '\n\nNote: ' + failedAttachments.length + ' image(s) could not be processed.';
                }
            }

            alert('Feedback submitted successfully!' + uploadWarning);
            document.getElementById('feedbackForm').reset();
            selectedFiles = [];
            document.getElementById('attachPreview').innerHTML = '';

            // Switch to list tab
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            document.querySelector('[data-tab="list"]').classList.add('active');
            document.getElementById('tab-list').classList.add('active');
        } catch(err) {
            alert('Submit failed: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Submit';
        }
    }

    // ============ Detail Modal ============
    function showDetail(id) {
        var f = allFeedbacks.find(function(item) { return item.id === id; });
        if (!f) return;

        document.getElementById('modalTitle').textContent = f.title || 'Untitled';

        var typeBadge = '<span class="badge-type badge-' + (f.type || 'bug') + '">' + (f.type || 'bug').toUpperCase() + '</span>';
        var statusBadge = '<span class="badge-status badge-' + (f.status || 'pending') + '">' + (f.status || 'pending').toUpperCase() + '</span>';
        var priorityBadge = f.priority ? '<span class="badge-type badge-' + f.priority + '">' + f.priority.toUpperCase() + '</span>' : '';

        var body = '<div style="display:flex;gap:0.5rem;margin-bottom:1rem;">' + typeBadge + ' ' + priorityBadge + ' ' + statusBadge + '</div>';
        body += '<div style="background:#f8fafc;border-radius:10px;padding:1rem;margin-bottom:1rem;">';
        body += '<div style="font-size:0.82rem;color:#64748b;margin-bottom:0.5rem;"><i class="fas fa-user me-1"></i>' + escapeHtml(f.createdBy ? f.createdBy.email : 'Unknown') + ' &middot; ' + (f.createdAt ? formatDate(f.createdAt) : '') + '</div>';
        if (f.reporterEmail) {
            body += '<div style="font-size:0.82rem;color:#64748b;margin-bottom:0.5rem;"><i class="fas fa-envelope me-1"></i> Notification: ' + escapeHtml(f.reporterEmail) + '</div>';
        }
        body += '<div style="font-size:0.9rem;color:#334155;white-space:pre-wrap;line-height:1.6;">' + escapeHtml(f.description || '') + '</div>';
        body += '</div>';

        // Attachments
        if (f.attachments && f.attachments.length > 0) {
            body += '<h6 style="font-weight:700;color:var(--primary-dark);margin-bottom:0.75rem;"><i class="fas fa-image me-1"></i> Attachments (' + f.attachments.length + ')</h6>';
            body += '<div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom:1rem;">';
            f.attachments.forEach(function(att) {
                var isBase64 = att.type === 'base64' || (att.url && att.url.startsWith('data:'));
                if (isBase64) {
                    body += '<div onclick="window.open().document.write(\'<img src=&quot;\' + this.querySelector(\'img\').src + \'&quot; style=&quot;max-width:100%&quot;>\')" style="display:block; width:160px; height:120px; border-radius:8px; overflow:hidden; border:1.5px solid #e2e8f0; cursor:pointer; transition:all 0.2s;" title="Click to enlarge">';
                    body += '<img src="' + att.url + '" style="width:100%; height:100%; object-fit:cover;" title="' + escapeHtml(att.name || '') + '">';
                    body += '</div>';
                } else {
                    body += '<a href="' + att.url + '" target="_blank" style="display:block; width:160px; height:120px; border-radius:8px; overflow:hidden; border:1.5px solid #e2e8f0; transition:all 0.2s;">';
                    body += '<img src="' + att.url + '" style="width:100%; height:100%; object-fit:cover;" title="' + escapeHtml(att.name || '') + '">';
                    body += '</a>';
                }
            });
            body += '</div>';
        }

        // Timeline
        body += '<h6 style="font-weight:700;color:var(--primary-dark);margin-bottom:0.75rem;"><i class="fas fa-history me-1"></i> Timeline</h6>';
        body += buildTimeline(f);

        // Admin response
        if (f.completionComment) {
            body += '<div style="background:#f0fdf4;border-radius:10px;padding:1rem;margin-top:1rem;">';
            body += '<div style="font-weight:600;font-size:0.85rem;color:#059669;margin-bottom:0.4rem;"><i class="fas fa-check-circle me-1"></i> Admin Response</div>';
            body += '<div style="font-size:0.85rem;color:#334155;">' + escapeHtml(f.completionComment) + '</div>';
            body += '</div>';
        }

        document.getElementById('modalBody').innerHTML = body;

        // Action buttons
        var footer = '';
        var isCreator = currentUser && f.createdBy && currentUser.uid === f.createdBy.uid;

        if (currentUserIsAdmin) {
            if (f.status === 'pending') {
                footer += '<button class="btn btn-primary btn-sm" onclick="updateStatus(\'' + id + '\',\'accepted\')"><i class="fas fa-check me-1"></i>Accept</button>';
            }
            if (f.status === 'accepted') {
                footer += '<input type="text" class="form-control form-control-sm me-2" id="completionComment" placeholder="Resolution comment..." style="max-width:300px;">';
                footer += '<button class="btn btn-success btn-sm" onclick="completeWithComment(\'' + id + '\')"><i class="fas fa-check-double me-1"></i>Complete</button>';
            }
        }

        if (isCreator || currentUserIsAdmin) {
            if (f.status === 'completed') {
                footer += '<button class="btn btn-outline-success btn-sm me-2" onclick="updateStatus(\'' + id + '\',\'approved\')"><i class="fas fa-thumbs-up me-1"></i>Approve</button>';
                footer += '<button class="btn btn-outline-danger btn-sm" onclick="rejectFeedback(\'' + id + '\')"><i class="fas fa-redo me-1"></i>Reject</button>';
            }
            if (f.status === 'approved') {
                footer += '<button class="btn btn-outline-warning btn-sm" onclick="reopenFeedback(\'' + id + '\')"><i class="fas fa-redo me-1"></i>Reopen</button>';
            }
        }

        footer += '<button class="btn btn-secondary btn-sm ms-auto" data-bs-dismiss="modal">Close</button>';
        document.getElementById('modalFooter').innerHTML = footer;

        new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    // ============ Actions ============
    function updateStatus(id, newStatus) {
        var updateData = {
            status: newStatus,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (newStatus === 'accepted') {
            updateData.acceptedAt = firebase.firestore.FieldValue.serverTimestamp();
            updateData.acceptedBy = { uid: currentUser.uid, email: currentUser.email, displayName: currentUser.displayName || currentUser.email };
        }
        if (newStatus === 'approved') {
            updateData.approvedAt = firebase.firestore.FieldValue.serverTimestamp();
            updateData.approvedBy = { uid: currentUser.uid, email: currentUser.email, displayName: currentUser.displayName || currentUser.email };
        }
        db.collection(COLLECTION).doc(id).update(updateData).then(function() {
            // Queue email notification for approved status
            if (newStatus === 'approved') {
                var f = allFeedbacks.find(function(item) { return item.id === id; });
                if (f && f.reporterEmail) {
                    queueNotification(id, f.title, f.reporterEmail, 'approved', f.completionComment || '');
                }
            }
            bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();
        });
    }

    function completeWithComment(id) {
        var comment = document.getElementById('completionComment').value.trim();
        if (!comment) { alert('Please enter a resolution comment.'); return; }
        db.collection(COLLECTION).doc(id).update({
            status: 'completed',
            completionComment: comment,
            completedAt: firebase.firestore.FieldValue.serverTimestamp(),
            completedBy: { uid: currentUser.uid, email: currentUser.email, displayName: currentUser.displayName || currentUser.email },
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(function() {
            // Queue email notification to reporter
            var f = allFeedbacks.find(function(item) { return item.id === id; });
            if (f && f.reporterEmail) {
                queueNotification(id, f.title, f.reporterEmail, 'completed', comment);
            }
            bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();
        });
    }

    function rejectFeedback(id) {
        var reason = prompt('Rejection reason:');
        if (!reason) return;
        db.collection(COLLECTION).doc(id).update({
            status: 'pending',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            rejectionHistory: firebase.firestore.FieldValue.arrayUnion({
                rejectedAt: new Date().toISOString(),
                rejectedBy: { uid: currentUser.uid, email: currentUser.email },
                comment: reason
            })
        }).then(function() {
            bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();
        });
    }

    function reopenFeedback(id) {
        var reason = prompt('Reopen reason:');
        if (!reason) return;
        db.collection(COLLECTION).doc(id).update({
            status: 'pending',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            reopenHistory: firebase.firestore.FieldValue.arrayUnion({
                reopenedAt: new Date().toISOString(),
                reopenedBy: { uid: currentUser.uid, email: currentUser.email },
                comment: reason
            })
        }).then(function() {
            bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide();
        });
    }

    // ============ Email Notification Queue ============
    function queueNotification(feedbackId, title, reporterEmail, newStatus, comment) {
        db.collection('pendingNotifications').add({
            feedbackId: feedbackId,
            title: title || 'Untitled',
            reporterEmail: reporterEmail,
            newStatus: newStatus,
            comment: comment || '',
            changedBy: currentUser ? currentUser.email : 'Unknown',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            sent: false
        }).then(function() {
            console.log('Notification queued for', reporterEmail);
        }).catch(function(err) {
            console.error('Failed to queue notification:', err);
        });
    }

    // ============ Helpers ============
    function buildTimeline(f) {
        var items = [];
        if (f.createdAt) items.push({ date: f.createdAt, text: 'Created by ' + (f.createdBy ? f.createdBy.email : 'Unknown'), color: '#94a3b8' });
        if (f.acceptedAt) items.push({ date: f.acceptedAt, text: 'Accepted by ' + (f.acceptedBy ? f.acceptedBy.email : 'Admin'), color: '#3b82f6' });
        if (f.completedAt) items.push({ date: f.completedAt, text: 'Completed by ' + (f.completedBy ? f.completedBy.email : 'Admin'), color: '#10b981' });
        if (f.approvedAt) items.push({ date: f.approvedAt, text: 'Approved by ' + (f.approvedBy ? f.approvedBy.email : ''), color: '#6366f1' });

        // Rejections
        if (f.rejectionHistory) {
            f.rejectionHistory.forEach(function(r) {
                items.push({ date: { toDate: function() { return new Date(r.rejectedAt); } }, text: 'Rejected: ' + r.comment, color: '#ef4444' });
            });
        }
        // Reopens
        if (f.reopenHistory) {
            f.reopenHistory.forEach(function(r) {
                items.push({ date: { toDate: function() { return new Date(r.reopenedAt); } }, text: 'Reopened: ' + r.comment, color: '#f59e0b' });
            });
        }

        items.sort(function(a, b) {
            var da = a.date && a.date.toDate ? a.date.toDate() : new Date(0);
            var db2 = b.date && b.date.toDate ? b.date.toDate() : new Date(0);
            return da - db2;
        });

        if (items.length === 0) return '<div style="font-size:0.85rem;color:#94a3b8;">No timeline data</div>';

        return items.map(function(item) {
            return '<div class="timeline-item">' +
                '<div class="timeline-dot" style="background:' + item.color + ';"></div>' +
                '<div><div class="timeline-text">' + escapeHtml(item.text) + '</div>' +
                '<div class="timeline-date">' + formatDate(item.date) + '</div></div>' +
            '</div>';
        }).join('');
    }

    function formatDate(ts) {
        if (!ts) return '';
        var d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function logout() {
        firebase.auth().signOut().then(function() {
            sessionStorage.removeItem(SESSION_KEY);
            window.location.href = 'auth.html';
        });
    }
    </script>
